[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-infra"
version = "0.3.0"
description = "Robot runtime, replay, discovery and independent live observations"
requires-python = ">=3.11"
dependencies = ["mcap>=1.3,<2", "jsonschema>=4.10.3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
video = ["Pillow>=10,<13"]
mp4 = ["av>=16.1,<17"]
motion = ["pin>=3,<5", "scipy>=1.16,<2"]
teleop = ["websockets>=16,<17"]
webrtc = ["aiortc>=1.14,<2", "av>=16.1,<17"]

[project.scripts]
robot-infra = "robot_infra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_infra = ["schemas/*.json", "web/*.html", "web/*.js", "web/*.css", "web/vendor/*.js", "web/vendor/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=artifacts/pytest"
