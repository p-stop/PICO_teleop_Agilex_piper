<text x="42" y="970" class="label">读图方式</text><text x="42" y="1003" class="sub">上半部：人的意图如何成为设备命令，以及实际状态如何返回。下半部：现场如何被看到、每一步如何留下证据。</text><text x="42" y="1032" class="sub">本轮真实控制只开放双臂；夹爪、旋转遥操、完整 MCAP episode、避碰和真实策略仍需后续独立验证。</text></svg>